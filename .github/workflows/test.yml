name: tests
on: [push, pull_request]
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s eval -v
      - run: python -m py_compile server.py rag.py warm_cache.py eval/run_eval.py
